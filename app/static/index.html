<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Little House</title>
<style>
/* Layout: full-screen plaster diorama (WebGL, Merzbau-like stepped volumes) + slide-in room panel. Single committed light look. */
:root{
  --plaster:#e4dfd4; --paper:#f3efe6; --ink:#1d1c1a; --muted:#77716a; --oxide:#b5452f; --line:rgba(29,28,26,.16);
  --display:"Helvetica Neue",Helvetica,Arial,sans-serif; --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;box-sizing:border-box;
}
html,body{height:100%;margin:0}
body{background:#0c0c0c;color:var(--ink);font:14px var(--body);overflow:hidden}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;filter:grayscale(1) contrast(1.35) brightness(.95)}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}

header{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));pointer-events:none;max-width:62%}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,48px);margin:0;line-height:.95;text-wrap:balance}
h1 em{color:var(--oxide)}
header p{margin:.5em 0 0;color:var(--muted);font-size:12px;letter-spacing:.02em}
header .grow{color:var(--ink);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;font-variant-numeric:tabular-nums}
.tag{position:fixed;transform:translate(-50%,-100%);cursor:pointer;background:var(--ink);border:0;color:var(--paper);font:700 10px var(--body);letter-spacing:.16em;text-transform:uppercase;padding:6px 8px 6px 10px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tag b{background:var(--oxide);color:var(--paper);padding:1px 5px;font-variant-numeric:tabular-nums}
.tag:hover,.tag:focus-visible{outline:2px solid var(--oxide);outline-offset:2px}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--paper);border-left:1px solid var(--ink);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#panel.open{transform:none}
.ph{padding:20px 20px 14px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--ink)}
.ph div{flex:1;min-width:0}
.ph small{color:var(--oxide);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.ph h2{font-family:var(--display);font-weight:400;font-size:38px;margin:.1em 0 0;line-height:1}
.ph p{margin:.4em 0 0;color:var(--muted);font-size:13px}
button{font:inherit;cursor:pointer}
.x{background:none;border:1px solid var(--ink);color:var(--ink);width:34px;height:34px;font-size:18px}
.x:hover{background:var(--ink);color:var(--paper)}
form{display:flex;gap:0;padding:14px 20px}
input{flex:1;min-width:0;background:#fff;border:1px solid var(--ink);border-right:0;color:var(--ink);padding:10px 12px;font:14px var(--body);border-radius:0}
input:focus{outline:2px solid var(--oxide);outline-offset:-2px}
.add{background:var(--ink);color:var(--paper);border:0;padding:0 16px;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.add:hover{background:var(--oxide)}
.filters{display:flex;gap:16px;padding:0 20px 8px}
.filters button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:4px 0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.filters button[aria-pressed=true]{color:var(--ink);border-color:var(--oxide)}
ul{list-style:none;margin:0;padding:0 20px 20px;overflow-y:auto;flex:1}
li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
li .t{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}
li.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--oxide)}
.chk{width:20px;height:20px;border:1.5px solid var(--ink);background:none;flex:none;color:var(--paper);font-size:12px;line-height:1;padding:0}
li.done .chk{background:var(--oxide);border-color:var(--oxide)}
.heart{background:none;border:0;color:#bbb4aa;font-size:15px;padding:2px 4px}
.heart.on{color:var(--oxide)}
.del{background:none;border:0;color:var(--muted);font-size:14px;padding:2px 4px;opacity:.5}
.del:hover{opacity:1;color:var(--oxide)}
.empty{color:var(--muted);padding:20px 0;font-size:14px}
#status{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));color:#999;font-size:12px;max-width:70%;z-index:4;margin:0}
body.inroom #status{display:none}
.tools{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 32px)}
.tools p{margin:0;background:var(--paper);border:1px solid var(--ink);padding:7px 10px;font-size:12px}
.solid,.ghost{border:1px solid var(--ink);padding:9px 14px;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.solid{background:var(--ink);color:var(--paper)}.solid:hover,.solid[aria-pressed=true]{background:var(--oxide);border-color:var(--oxide)}
.ghost{background:var(--paper);color:var(--ink)}.ghost:hover{background:var(--ink);color:var(--paper)}
body.arranging .tag{display:none}
body.arranging #status{display:none}
body.inroom .tools{display:none}
.login{position:fixed;inset:0;background:rgba(228,223,212,.86);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.login form{background:var(--paper);border:1px solid var(--ink);padding:24px;display:grid;gap:10px;width:min(340px,100%)}
.login h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0 0 6px}.login h2 em{color:var(--oxide)}
.login label{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.login input{border-right:1px solid var(--ink)}
.login p{margin:0;color:var(--oxide);font-size:13px;min-height:1em}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>
</head>
<body>

<canvas id="scene" aria-label="An abstract plaster house with four rooms"></canvas>
<header><h1>Our <em>little</em> house</h1><p>Drag to look around. Tap a room to go inside.</p><p id="grow" class="grow"></p></header>
<div id="tags"></div>
<aside id="panel" aria-hidden="true">
  <div class="ph"><div><small id="pk"></small><h2 id="pt"></h2><p id="pd"></p></div><button class="x" id="close" aria-label="Back to the house">×</button></div>
  <form id="f"><input id="newItem" placeholder="Add something…" autocomplete="off"><button class="add">Add</button></form>
  <div class="filters"><button data-f="todo" aria-pressed="true">To do</button><button data-f="done" aria-pressed="false">Done</button><button data-f="all" aria-pressed="false">All</button></div>
  <ul id="list"></ul>
</aside>
<p id="status"></p>
<div class="tools"><p id="hint" hidden>Drag a piece to move it. Tap it to turn it.</p><button id="reset" class="ghost" hidden>Reset layout</button><button id="arrange" class="solid" aria-pressed="false">Arrange</button></div>

<div id="login" class="login" hidden><form id="loginForm"><h2>Our <em>little</em> house</h2><label for="pw">House password</label><input id="pw" type="password" autocomplete="current-password" required><button class="solid">Come in</button><p id="loginErr" role="alert"></p></form></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ROOMS=[
 {id:"movies",name:"Living room",kind:"Movie night",hint:"Films to watch together",ph:"Add a film…",x:-1,z:1,lvl:0,acc:0x2f4fa8},
 {id:"food",name:"Kitchen",kind:"Food ideas",hint:"Recipes to cook and places to eat",ph:"Add a dish or restaurant…",x:1,z:1,lvl:1,acc:0xc9952f},
 {id:"dates",name:"Bedroom",kind:"Date ideas",hint:"Things to do, big and small",ph:"Add a date idea…",x:-1,z:-1,lvl:2,acc:0xb5452f},
 {id:"trips",name:"Garden",kind:"Places to go",hint:"Trips and weekends away",ph:"Add a place…",x:1,z:-1,lvl:3,acc:0x3f6b4c}
];
let items=[],cur=null,filter="todo",db=null,started=null;
const $=s=>document.querySelector(s);
function hash(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return (h>>>0)/4294967295}

/* ---------- 3D ---------- */
const canvas=$("#scene");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const BG=0xe4dfd4;
const scene=new THREE.Scene();scene.background=new THREE.Color(BG);scene.fog=new THREE.Fog(BG,16,34);
const camera=new THREE.PerspectiveCamera(32,1,.1,100);
scene.add(new THREE.HemisphereLight(0xfffaf0,0x8a8070,.5));
const sun=new THREE.DirectionalLight(0xfff1dc,.8);sun.position.set(-7,11,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0006;
Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8});scene.add(sun);

const mats={};function M(c){return mats[c]||(mats[c]=new THREE.MeshStandardMaterial({color:c,roughness:.92,flatShading:true}))}
const PL=0xefebe3,PL2=0xdcd5c8,PL3=0xc8c0b1,INK=0x1d1c1a,WOOD=0xa98a63;
function box(w,h,d,c,x,y,z,p=scene,rx=0,ry=0,rz=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.castShadow=m.receiveShadow=true;p.add(m);return m}
function prism(r,h,c,x,y,z,p,ry=0,rz=0,sides=3){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,sides),M(c));m.position.set(x,y,z);m.rotation.set(0,ry,rz);m.castShadow=m.receiveShadow=true;p.add(m);return m}

// ground + plinth
const g=new THREE.Mesh(new THREE.PlaneGeometry(80,80),M(0xd9d3c6));g.rotation.x=-Math.PI/2;g.position.y=-.4;g.receiveShadow=true;scene.add(g);
box(8.8,.4,8.8,PL2,0,-.2,0);

// rooms as stepped terraces
const picks=[];const STEP=.22;
ROOMS.forEach(r=>{
  const y=r.lvl*STEP;const grp=new THREE.Group();grp.position.set(r.x*2,y,r.z*2);scene.add(grp);r.group=grp;r.y=y;
  const fl=box(3.96,.16+y,3.96,PL,0,-(y)/2,0,grp);fl.userData.room=r;picks.push(fl);r.floorMesh=fl;
  // accent inlay
  const inl=box(1.1,.02,.18,r.acc,-1.2+hash(r.id)*.6,.09,1.6-hash(r.id+"i")*.4,grp);
  r.glow=new THREE.PointLight(0xfff0d8,0,5,2);r.glow.position.set(0,1.6,0);grp.add(r.glow);
});

// grotto walls: overlapping tilted planes along back and left
for(let i=0;i<7;i++){const h=1.6+hash("b"+i)*1.8,w=1+hash("bw"+i)*1.4;box(w,h,.12,i%3?PL:PL2,-3.6+i*1.2,h/2,-4.1+hash("bz"+i)*.2,scene,0,(hash("br"+i)-.5)*.35,(hash("bt"+i)-.5)*.25)}
for(let i=0;i<6;i++){const h=1.2+hash("l"+i)*1.6,w=1+hash("lw"+i)*1.4;box(.12,h,w,i%2?PL:PL2,-4.1+hash("lz"+i)*.2,h/2,3.6-i*1.35,scene,(hash("lt"+i)-.5)*.25,(hash("lr"+i)-.5)*.3,0)}
// a few colour panels slotted into the walls, Merz-style
box(.7,1.1,.04,0xb5452f,-1.6,1.4,-3.95,scene,0,.08,-.06);box(.9,.5,.04,0x2f4fa8,1.9,2.1,-3.95,scene,0,-.1,.04);box(.04,.8,.6,0xc9952f,-3.95,1.1,-.8,scene);box(.4,.4,.04,INK,.4,2.6,-3.9,scene,0,0,.3);
// low dividers between rooms: offset slabs, not full walls
box(3.2,.7,.1,PL3,-1.9,.35,0,scene,0,.04,0);box(1.6,1.1,.1,PL,2.6,.55+STEP,-.05);box(.1,.9,2.6,PL3,0,.45,2.3);box(.1,1.4,1.8,PL,.05,.7+STEP*2,-2.6);
// cantilevered roof fragments
box(3.4,.08,1.6,PL,-2.4,2.9,-3.1,scene,.05,.1,0);box(1.8,.08,2.6,PL2,-3.2,2.4,1.4,scene,0,-.08,.06);

// ---- movable furniture: each piece is a group in world space, origin on the floor ----
function roomAt(x,z){return ROOMS.find(r=>Math.sign(x||1)===r.x&&Math.sign(z||1)===r.z)}
const PIECES=[],pieceById={};
function piece(id,room,lx,lz,build){const r=ROOMS.find(q=>q.id===room);const p=new THREE.Group();p.userData={piece:id,home:[r.x*2+lx,r.z*2+lz,0]};
  build(p);scene.add(p);PIECES.push(p);pieceById[id]=p;setPiece(p,r.x*2+lx,r.z*2+lz,0,true);return p}
function setPiece(p,x,z,ry,snap){x=Math.max(-3.7,Math.min(3.7,x));z=Math.max(-3.7,Math.min(3.7,z));const y=roomAt(x,z).y;
  p.userData.t=[x,y,z,ry];if(snap){p.position.set(x,y,z);p.rotation.y=ry}}
function mesh(geo,c,x,y,z,p,rx=0,ry=0,rz=0){const m=new THREE.Mesh(geo,M(c));m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.castShadow=m.receiveShadow=true;p.add(m);return m}
// living room
piece("screen","movies",0,-1.5,p=>{box(1.9,1.1,.06,INK,0,.8,0,p,-.08,.12,0);box(1.5,.8,.03,0x2f4fa8,.05,.82,.06,p,-.08,.12,0)});
piece("bench","movies",-.1,.9,p=>box(2.2,.28,.6,PL3,0,.22,0,p,0,-.06,0));
piece("cube","movies",1.3,.6,p=>box(.6,.6,.6,PL2,0,.38,0,p,0,.3,0));
// kitchen
piece("counter","food",-.6,-1.4,p=>{box(2.4,.12,.8,PL3,.4,.75,0,p);box(.6,.7,.6,PL2,-.5,.35,0,p)});
piece("cylinder","food",1.3,-1.2,p=>mesh(new THREE.CylinderGeometry(.32,.32,1.4,24),0xc9952f,0,.7,0,p));
piece("table","food",-.2,.5,p=>{box(1.2,.08,1.2,WOOD,0,.55,0,p,0,.4,0);box(.12,.5,.12,INK,0,.27,0,p)});
// bedroom
piece("stair","dates",-.6,.1,p=>{for(let i=0;i<5;i++)box(.9,.18*(i+1),.4,i%2?PL:PL2,0,.09*(i+1),.8-i*.4,p)});
piece("sphere","dates",.9,.1,p=>mesh(new THREE.SphereGeometry(.38,20,14),0xb5452f,0,.46,0,p));
piece("bed","dates",.5,-1.1,p=>box(1.4,.3,1.8,PL,0,.15,0,p,0,-.2,0));
// garden: the growing Merz column (movable too)
const column=new THREE.Group();piece("column","trips",.5,-.5,p=>p.add(column));
const colSegs=[];
for(let i=0;i<22;i++){const s=1-i*.028,h=.18+hash("ch"+i)*.22;const c=(i%5===3)?[0xb5452f,0x2f4fa8,0xc9952f,INK][i%4]:(i%2?PL:PL2);
  const m=new THREE.Mesh(i%3===1?new THREE.CylinderGeometry(.42*s,.42*s,h,3):new THREE.BoxGeometry(.7*s,h,.7*s),M(c));
  m.rotation.y=hash("cr"+i)*Math.PI;m.position.x=(hash("cx"+i)-.5)*.18;m.position.z=(hash("cz"+i)-.5)*.18;m.castShadow=m.receiveShadow=true;m.userData.h=h;m.scale.setScalar(.001);column.add(m);colSegs.push(m)}
let colVisible=0;
// room spires: grow with ticked-off items in that room
const spireSpots={movies:[1.5,-1.5],food:[1.5,.9],dates:[1.4,1.4],trips:[-1.5,1.4]};
ROOMS.forEach(r=>{const sp=new THREE.Group();const s=spireSpots[r.id];sp.position.set(s[0],.08,s[1]);r.group.add(sp);r.spire=sp;r.spireN=-1});
function buildSpire(r,n){if(n===r.spireN)return;const old=r.spireN<0?0:r.spireN;r.spireN=n;
  while(sp=r.spire.children[n])r.spire.remove(sp);
  let y=r.spire.children.reduce((a,m)=>a+m.userData.h,0);
  for(let i=r.spire.children.length;i<Math.min(n,24);i++){const h=.12+hash(r.id+i)*.1,w=.32-i*.008;const c=i%4===2?r.acc:(i%2?PL:PL3);
    const m=box(w,h,w,c,(hash(r.id+"x"+i)-.5)*.06,y+h/2,(hash(r.id+"z"+i)-.5)*.06,r.spire,0,hash(r.id+"r"+i)*1.6,0);m.userData.h=h;
    if(i>=old){m.scale.setScalar(.001);m.userData.grow=1}y+=h}}
var sp;
// shards in the garden: one per ticked-off item anywhere
const shardG=new THREE.Group();ROOMS[3].group.add(shardG);const SC=[0xb5452f,0x2f4fa8,0xc9952f,0x1d1c1a,0xefebe3];let shardKey="";
function growShards(done){const key=done.map(i=>i.id).join();if(key===shardKey)return;const had=new Set(shardG.children.map(c=>c.userData.id));shardKey=key;
  while(shardG.children.length)shardG.remove(shardG.children[0]);
  done.slice(0,60).forEach(i=>{let x=-1.7+hash(i.id)*3.4,z=-1.7+hash(i.id+"z")*3.4;if(Math.hypot(x-.5,z+.5)<.7){x=x<.5?x-.7:x+.7}
    const t=new THREE.Mesh(new THREE.TetrahedronGeometry(.08+hash(i.id+"s")*.1),M(SC[Math.floor(hash(i.id+"c")*SC.length)]));
    t.position.set(x,.12,z);t.rotation.set(hash(i.id+"a")*3,hash(i.id+"b")*3,0);t.castShadow=true;t.userData.id=i.id;
    if(!had.has(i.id)){t.scale.setScalar(.001);t.userData.grow=1}shardG.add(t)})}

function updGrowth(){const days=started?Math.max(0,(Date.now()-started)/864e5):0;
  colVisible=Math.min(colSegs.length,3+Math.floor(Math.sqrt(days)*2.2));
  ROOMS.forEach(r=>buildSpire(r,items.filter(i=>i.room===r.id&&i.done).length));
  const done=items.filter(i=>i.done).sort((a,b)=>(a.ts||0)-(b.ts||0));growShards(done);
  $("#grow").textContent=started?`Day ${Math.floor(days)+1} · ${done.length} done · column ${colVisible} high`:""}

let theta=.7,phi=.98,dist=14,target=new THREE.Vector3(0,.4,0),tTarget=target.clone(),tDist=dist;
function place(){camera.position.set(target.x+dist*Math.sin(phi)*Math.sin(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(target)}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();tDist=cur?7.5:(w<600?20:16)}
addEventListener("resize",resize);resize();dist=tDist;

let drag=null,moved=0,arrange=false,grab=null,hovPiece=null;
const ray=new THREE.Raycaster(),v2=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();
function aim(e){v2.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(v2,camera)}
function pick(e){aim(e);const h=ray.intersectObjects(picks)[0];return h&&h.object.userData.room}
function pickPiece(e){aim(e);const h=ray.intersectObjects(PIECES,true)[0];if(!h)return null;let o=h.object;while(o&&!o.userData.piece)o=o.parent;return o}
canvas.addEventListener("pointerdown",e=>{moved=0;canvas.setPointerCapture(e.pointerId);
  if(arrange){const p=pickPiece(e);if(p){plane.constant=-p.position.y;aim(e);ray.ray.intersectPlane(plane,hit);grab={p,dx:p.position.x-hit.x,dz:p.position.z-hit.z};return}}
  drag={x:e.clientX,y:e.clientY}});
canvas.addEventListener("pointermove",e=>{
  if(grab){moved+=Math.abs(e.movementX)+Math.abs(e.movementY);aim(e);if(ray.ray.intersectPlane(plane,hit)){const t=grab.p.userData.t;setPiece(grab.p,hit.x+grab.dx,hit.z+grab.dz,t[3])}return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);theta-=dx*.006;phi=Math.min(1.35,Math.max(.35,phi-dy*.006));drag={x:e.clientX,y:e.clientY}}
  else hover(e)});
canvas.addEventListener("pointerup",e=>{
  if(grab){const p=grab.p,t=p.userData.t;if(moved<6)setPiece(p,t[0],t[2],t[3]+Math.PI/4);savePiece(p);grab=null;return}
  if(moved<6&&!arrange){const r=pick(e);if(r)openRoom(r.id);else if(cur)closeRoom()}drag=null});
canvas.addEventListener("wheel",e=>{tDist=Math.min(24,Math.max(5,tDist+e.deltaY*.01))},{passive:true});
let hov=null;function hover(e){if(arrange){hovPiece=pickPiece(e);hov=null;canvas.style.cursor=hovPiece?"move":"grab";return}hovPiece=null;hov=pick(e);canvas.style.cursor=hov?"pointer":"grab"}
async function savePiece(p){if(!db)return;const t=p.userData.t;try{await api("PUT","/api/layout/"+p.userData.piece,{x:+t[0].toFixed(3),z:+t[2].toFixed(3),r:+t[3].toFixed(4)})}catch(e){status("Couldn't save the new layout.")}}
const arrBtn=$("#arrange"),resetBtn=$("#reset");
arrBtn.onclick=()=>{arrange=!arrange;if(arrange&&cur)closeRoom();arrBtn.setAttribute("aria-pressed",arrange);arrBtn.textContent=arrange?"Done":"Arrange";$("#hint").hidden=!arrange;resetBtn.hidden=!arrange;document.body.classList.toggle("arranging",arrange)};
resetBtn.onclick=async()=>{PIECES.forEach(p=>{const h=p.userData.home;setPiece(p,h[0],h[1],0)});if(db)try{await api("DELETE","/api/layout")}catch(e){}};

const tags=$("#tags");
ROOMS.forEach(r=>{const b=document.createElement("button");b.className="tag";b.onclick=()=>openRoom(r.id);tags.appendChild(b);r.tag=b});
function updTags(){ROOMS.forEach(r=>{r.tag.textContent=r.kind})}
const tmp=new THREE.Vector3();
function loop(t){
  target.lerp(tTarget,.08);dist+=(tDist-dist)*.08;place();
  ROOMS.forEach(r=>{const on=cur===r.id,h=hov===r;r.glow.intensity+=((on?1.1:h?.6:0)-r.glow.intensity)*.1;
    tmp.set(r.x*2,r.y+1.9,r.z*2).project(camera);r.tag.style.left=(tmp.x*.5+.5)*innerWidth+"px";r.tag.style.top=(-tmp.y*.5+.5)*innerHeight+"px";r.tag.hidden=!!cur||tmp.z>1;
    r.spire.children.forEach(m=>{if(m.userData.grow){const s=m.scale.x+(1-m.scale.x)*.08;m.scale.setScalar(s);if(s>.99)m.userData.grow=0}})});
  let y=0;colSegs.forEach((m,i)=>{const tg=i<colVisible?1:.001;const s=m.scale.x+(tg-m.scale.x)*(.03+i*.002);m.scale.setScalar(s);m.position.y=y+m.userData.h*s/2;y+=m.userData.h*s});
  PIECES.forEach(p=>{const q=p.userData.t,lift=(grab&&grab.p===p)?.25:(hovPiece===p?.08:0);
    p.position.x+=(q[0]-p.position.x)*.25;p.position.z+=(q[2]-p.position.z)*.25;p.position.y+=(q[1]+lift-p.position.y)*.2;p.rotation.y+=(q[3]-p.rotation.y)*.2});
  column.rotation.y=Math.sin(t*.0002)*.05;
  shardG.children.forEach(c=>{if(c.userData.grow){const s=c.scale.x+(1-c.scale.x)*.06;c.scale.setScalar(s);if(s>.99)c.userData.grow=0}});
  renderer.render(scene,camera);requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- panel ---------- */
function openRoom(id){const r=ROOMS.find(x=>x.id===id);cur=id;tTarget.set(r.x*2,r.y+.3,r.z*2);tDist=7.5;
  $("#pk").textContent=r.name;$("#pt").textContent=r.kind;$("#pd").textContent=r.hint;$("#newItem").placeholder=r.ph;
  $("#panel").classList.add("open");document.body.classList.add("inroom");$("#panel").setAttribute("aria-hidden","false");render()}
function closeRoom(){cur=null;tTarget.set(0,.4,0);resize();$("#panel").classList.remove("open");document.body.classList.remove("inroom");$("#panel").setAttribute("aria-hidden","true")}
$("#close").onclick=closeRoom;addEventListener("keydown",e=>{if(e.key==="Escape"&&cur)closeRoom()});
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll(".filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});

function render(){updTags();updGrowth();if(!cur)return;const ul=$("#list");ul.innerHTML="";
  let rows=items.filter(i=>i.room===cur&&(filter==="all"||(filter==="done")===!!i.done));
  rows.sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||(b.ts||0)-(a.ts||0));
  if(!rows.length){const e=document.createElement("li");e.className="empty";e.textContent=db?(filter==="done"?"Nothing ticked off yet. Each one you finish adds a block to this room.":"Empty for now. Add the first one above."):"Sign in to see your lists.";ul.appendChild(e);return}
  rows.forEach(i=>{const li=document.createElement("li");if(i.done)li.className="done";
    const c=document.createElement("button");c.className="chk";c.textContent=i.done?"✓":"";c.setAttribute("aria-label",i.done?"Mark as not done":"Mark as done");c.onclick=()=>save(i.id,{done:!i.done,doneAt:i.done?null:Date.now()});
    const t=document.createElement("span");t.className="t";t.textContent=i.text;
    const h=document.createElement("button");h.className="heart"+(i.fav?" on":"");h.textContent="♥";h.setAttribute("aria-label","Favourite");h.onclick=()=>save(i.id,{fav:!i.fav});
    const d=document.createElement("button");d.className="del";d.textContent="✕";d.setAttribute("aria-label","Remove");d.onclick=()=>remove(i.id);
    li.append(c,t,h,d);ul.appendChild(li)})}

$("#f").addEventListener("submit",async e=>{e.preventDefault();const v=$("#newItem").value.trim();if(!v||!cur||!db)return;$("#newItem").value="";
  const id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{await api("POST","/api/items",{room:cur,text:v.slice(0,200)})}catch(err){status("Couldn't save that.")}});
async function save(id,patch){try{await api("PATCH","/api/items/"+id,patch)}catch(e){status("Couldn't save that change.")}}
async function remove(id){try{await api("DELETE","/api/items/"+id)}catch(e){status("Couldn't remove that.")}}
function status(s){$("#status").textContent=s}
updTags();updGrowth();

/* ---------- server sync: REST for writes, one WebSocket for live state ---------- */
async function api(method,url,body){const r=await fetch(url,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,credentials:"same-origin"});
  if(r.status===401){showLogin();throw new Error("auth")}if(!r.ok)throw new Error(r.status);return r.status===204?null:r.json()}
function applyState(st){items=st.items||[];started=st.started||null;const seen=new Set();
  (st.layout||[]).forEach(v=>{const p=pieceById[v.piece];if(!p)return;seen.add(v.piece);if(grab&&grab.p===p)return;setPiece(p,+v.x||0,+v.z||0,+v.r||0)});
  PIECES.forEach(p=>{if(!seen.has(p.userData.piece)&&!(grab&&grab.p===p)){const h=p.userData.home;setPiece(p,h[0],h[1],0)}});render()}
let ws=null,retry=1000;
function connect(){ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
  ws.onopen=()=>{retry=1000;db=true;status("")};
  ws.onmessage=e=>{try{applyState(JSON.parse(e.data))}catch(err){}};
  ws.onclose=ev=>{db=null;if(ev.code===4401){showLogin();return}status("Reconnecting…");setTimeout(connect,retry);retry=Math.min(retry*2,15000)}}
function showLogin(){$("#login").hidden=false;$("#pw").focus()}
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#pw").value})});
  if(r.ok){$("#login").hidden=true;$("#pw").value="";$("#loginErr").textContent="";connect()}else $("#loginErr").textContent="That password didn't work."});
fetch("/api/me").then(r=>{if(r.ok)connect();else{status("");showLogin()}}).catch(()=>status("Can't reach the server."));
</script>
</body>
